apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: python-hello
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux-image-automation
        email: flux@brainylabs.com.br
      messageTemplate: "chore: update python-hello image to {{range .Changed.Changes}}{{.}}{{end}}"
    push:
      branch: main
  update:
    strategy: Setters
    path: ./homelab-v8/apps/python-hello/devops/deploy
