---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: bun-hello-binding
  namespace: tekton-pipelines
spec:
  params:
    - name: gitrevision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bun-hello-trigger
  namespace: tekton-pipelines
spec:
  params:
    - name: gitrevision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: TaskRun
      metadata:
        generateName: bun-hello-ci-
        namespace: tekton-pipelines
      spec:
        timeout: 30m
        taskRef:
          name: bun-hello-ci
        params:
          - name: revision
            value: $(tt.params.gitrevision)
        workspaces:
          - name: source
            emptyDir: {}
