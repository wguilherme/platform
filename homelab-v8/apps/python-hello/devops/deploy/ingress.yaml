apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-hello
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: python.wguilherme.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: python-hello
                port:
                  number: 80
