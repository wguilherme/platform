---
all:
  children:
    k3s_cluster:
      hosts:
        rpi:
          ansible_host: "{{ lookup('env', 'RPI_HOST') }}"
          ansible_user: ubuntu # Usuário padrão do Ubuntu Server
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          ansible_python_interpreter: /usr/bin/python3

      vars:
        # K3s cluster configuration
        k3s_version: "v1.36.1+k3s1"
        k3s_install_options:
          - "--disable=traefik"
          - "--write-kubeconfig-mode=644"
          - "--tls-san={{ ansible_host }}"
          - "--tls-san=rpi"
          - "--node-ip={{ ansible_host }}"

        # Single node configuration
        k3s_node_role: "server"
        k3s_single_node: true

        # Raspberry Pi specific
        k3s_disable_swap: true
        k3s_enable_cgroups: true

        # Kubeconfig
        k3s_fetch_kubeconfig: true
        k3s_local_kubeconfig_path: "{{ playbook_dir }}/kubeconfig"

        # Ansible connection settings
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_pass: "{{ lookup('env', 'RPI_PASSWORD') }}"
